name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Issue Triage
        id: claude-triage
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Analiza el issue #${{ github.event.issue.number }} de este repositorio
            (título: "${{ github.event.issue.title }}").

            Tareas:
            1. Lee el issue completo con `gh issue view ${{ github.event.issue.number }}`.
            2. Revisa las labels existentes en el repo con `gh label list` y elige las que
               apliquen (tipo: bug/enhancement/question/documentation; área/componente si
               aplica; prioridad si es evidente). Si no existe ninguna label adecuada, no
               inventes una nueva salvo que sea claramente necesaria — en ese caso créala
               primero con `gh label create`.
            3. Aplica las labels elegidas al issue con
               `gh issue edit ${{ github.event.issue.number }} --add-label "..."`.
            4. Publica un comentario en el issue (`gh issue comment ${{ github.event.issue.number }} --body "..."`)
               con un diagnóstico general y conciso del problema, en español, que incluya:
               - Resumen del problema/petición.
               - Posible causa raíz o área del código afectada (basado en la estructura del
                 repo descrita en CLAUDE.md: `game.js`, `index.html`, `style.css`).
               - Sugerencia de enfoque para la solución (sin escribir el código todavía).
               Este comentario servirá de base para implementar la solución más adelante.

            No hagas cambios de código ni abras PRs — solo etiqueta y comenta.
          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*),Bash(gh label create:*)"'
